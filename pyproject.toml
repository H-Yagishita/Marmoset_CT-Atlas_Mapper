[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marmoset-atlas-mapper"
version = "1.00"
description = "Multi-reference CT-to-atlas mapping for the common marmoset"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "data/README.md"]
dependencies = [
  "numpy==2.5.1",
  "SimpleITK==2.5.6",
  "PySide6==6.11.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
