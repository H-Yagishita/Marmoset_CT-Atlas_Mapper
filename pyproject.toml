[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marmoset-atlas-mapper"
version = "0.1.0"
description = "Landmark-based mapping between marmoset CT and the Brain/MINDS BMA 2.0 atlas"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.1",
  "SimpleITK==2.5.6",
  "PySide6==6.11.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
